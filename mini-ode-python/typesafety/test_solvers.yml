- case: euler_solver_correct_usage
  main: |
    import mini_ode
    import torch

    f = torch.jit.trace(lambda x, y: y, (torch.tensor(0.), torch.tensor([0.])))
    solver = mini_ode.EulerMethodSolver(step=0.01)
    xs, ys = solver.solve(f, (0., 1.), torch.tensor([1.]))
    reveal_type(xs)  # N: Revealed type is "torch._tensor.Tensor"
    reveal_type(ys)  # N: Revealed type is "torch._tensor.Tensor"

- case: euler_solver_wrong_step_type
  main: |
    import mini_ode
    solver = mini_ode.EulerMethodSolver(step="0.1")
  out: |
    main:2: error: Argument "step" to "EulerMethodSolver" has incompatible type "str"; expected "float"  [arg-type]

- case: euler_solver_assign_final_step
  main: |
    import mini_ode
    solver = mini_ode.EulerMethodSolver(step=0.01)
    solver.step = 0.02
  out: |
    main:3: error: Cannot assign to final attribute "step"  [misc]

- case: euler_solver_assign_wrong_type_step
  main: |
    import mini_ode
    solver = mini_ode.EulerMethodSolver(step=0.01)
    solver.step = "0.1"
  out: |
    main:3: error: Cannot assign to final attribute "step"  [misc]
    main:3: error: Incompatible types in assignment (expression has type "str", variable has type "float")  [assignment]

