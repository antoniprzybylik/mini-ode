- case: implicit_euler_correct_usage
  main: |
    import mini_ode
    import torch

    f = torch.jit.trace(lambda x, y: y, (torch.tensor(0.), torch.tensor([0.])))
    opt = mini_ode.optimizers.Newton(max_steps=3)
    solver = mini_ode.ImplicitEulerMethodSolver(step=0.01, optimizer=opt)
    xs, ys = solver.solve(f, (0., 1.), torch.tensor([1.]))
    reveal_type(xs)  # N: Revealed type is "torch._tensor.Tensor"
    reveal_type(ys)  # N: Revealed type is "torch._tensor.Tensor"

